<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>친구랑 톡 💬</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 책상으로</a>
    <h1>친구랑 톡 💬</h1>

    <!-- 잠금화면: 폰(phone_00) 크게. 누르면 채팅 열림 -->
    <div id="lock" class="lockwrap">
      <div class="phone-crop lock-crop">
        <img src="assets/phone_00.png" class="phone-frame-img" alt="잠금화면" />
      </div>
      <p class="tap-hint">화면을 톡 누르면 열려요 👆</p>
    </div>

    <!-- 채팅: 프레임은 phone_01 이미지, 내부 UI는 두들 디자인 -->
    <div id="chat" class="phone-crop chat-crop" hidden>
      <img src="assets/phone_01.png" class="phone-frame-img" alt="" />
      <div class="phone-screen-area">
        <div class="chat-header">
          <span class="chat-avatar">❤️</span>
          <span id="chatName">친구</span>
        </div>
        <div class="chat-log" id="log" aria-live="polite"></div>
        <div class="emoji-tray" id="emojiTray" hidden></div>
        <form class="chat-input" id="form" autocomplete="off">
          <button type="button" id="emojiBtn" class="emoji-btn" aria-label="이모티콘" hidden>🙂</button>
          <input id="msg" type="text" placeholder="메시지…" aria-label="메시지 입력" />
          <button type="submit" id="send">↑</button>
        </form>
      </div>
    </div>
  </div>

  <script src="emoji-context.js"></script>
  <script src="chat.js"></script>
</body>
</html>

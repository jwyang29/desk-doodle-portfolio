<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>친구랑 톡 💬</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 책상으로</a>
    <h1>친구랑 톡 💬</h1>

    <!-- 잠금화면: 이미지 누르면 채팅 열림 -->
    <div id="lock" class="lockwrap">
      <img src="assets/phone_00.png" class="lockimg" alt="잠금화면" />
      <p class="tap-hint">화면을 톡 누르면 열려요 👆</p>
    </div>

    <!-- 채팅 (두들 폰) -->
    <div id="chat" class="chatphone" hidden>
      <div class="chat-header">
        <span class="chat-avatar">❤️</span>
        <span id="chatName">친구</span>
        <span class="chat-status">지금 접속 중</span>
      </div>
      <div class="chat-log" id="log" aria-live="polite"></div>
      <form class="chat-input" id="form" autocomplete="off">
        <input id="msg" type="text" placeholder="메시지 입력…" aria-label="메시지 입력" />
        <button type="submit" id="send">보내기</button>
      </form>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>

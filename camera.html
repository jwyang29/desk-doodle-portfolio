<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내가 찍은 사진 📷</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 책상으로</a>
    <h1>내가 찍은 사진 📷</h1>
    <p class="sub">좋아하는 순간들.</p>
    <div class="grid" id="grid"></div>
  </div>
  <script src="gallery.js"></script>
  <script>
    const grid = document.getElementById("grid");
    probeImages("assets/photos/photo", IMG_EXTS, (list) => {
      if (!list.length) {
        grid.innerHTML = '<p class="empty">아직 사진이 없어요. assets/photos/ 에 photo1.jpg, photo2.jpg … 로 올려주세요.</p>';
        return;
      }
      list.forEach((src, i) => {
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        img.className = "thumb-photo";
        img.src = src;
        img.alt = "사진 " + (i + 1);
        img.loading = "lazy";
        const cap = document.createElement("figcaption");
        cap.textContent = "사진 " + (i + 1);
        fig.append(img, cap);
        grid.appendChild(fig);
      });
    });
  </script>
</body>
</html>

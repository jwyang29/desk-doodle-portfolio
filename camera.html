<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내가 찍은 사진 📷</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    /* 벽 느낌 */
    body { background: #f3efe6; }
    @media (prefers-color-scheme: dark) { body { background: #f3efe6; } }

    .clothesline { position: relative; overflow-x: auto; overflow-y: hidden; padding: 8px 6px 24px; }
    /* 줄 + 폴라로이드 한 줄 */
    .line-row { position: relative; padding-top: 44px; margin-bottom: 18px; }
    .line-row::before {           /* 벽에 걸린 줄 */
      content: ""; position: absolute; left: 6px; right: 6px; top: 26px; height: 3px;
      background: #3a3330; border-radius: 3px;
      box-shadow: 0 6px 0 -4px rgba(0,0,0,0.12);
    }
    .pins {
      display: flex; gap: clamp(16px, 3vw, 40px); align-items: flex-start;
      min-width: min-content; padding: 0 10px;
    }

    .polaroid {
      position: relative; flex: none; width: clamp(150px, 40vw, 210px);
      background: #fff; padding: 12px 12px 0; border-radius: 3px;
      box-shadow: 3px 7px 14px rgba(60,45,30,0.28);
      transform: rotate(var(--rot, 0deg)); transform-origin: top center;
      text-decoration: none; color: var(--ink); cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .polaroid:hover { transform: rotate(0deg) translateY(-4px) scale(1.03); box-shadow: 4px 12px 20px rgba(60,45,30,0.35); z-index: 3; }
    .polaroid .photo {
      width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #e9e4da;
      display: flex; align-items: center; justify-content: center;
    }
    .polaroid .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .polaroid .photo .ph { color: #b3a89a; font-size: 13px; }
    .polaroid .cap {
      font-family: "Caveat", "Gaegu", cursive; font-size: clamp(17px, 2.4vw, 22px);
      text-align: center; padding: 9px 4px 14px; color: #4a4038;
    }
    /* 집게 (빨래집게) */
    .pin {
      position: absolute; top: -19px; left: 50%; transform: translateX(-50%);
      width: 15px; height: 30px; z-index: 4;
    }
    .pin::before {              /* 나무 몸통 */
      content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #d9a25e, #c98a44);
      border: 1.5px solid #7a5326; border-radius: 4px;
    }
    .pin::after {               /* 가운데 스프링 선 */
      content: ""; position: absolute; left: 50%; top: 5px; width: 2px; height: 18px;
      background: #7a5326; transform: translateX(-50%); border-radius: 2px;
    }

    .empty2 { font-size: 18px; color: #777; padding: 30px 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 책상으로</a>
    <h1>내가 찍은 사진 📷</h1>
    <p class="sub">벽에 걸어둔 폴라로이드들 — 눌러서 자세히 봐요.</p>
    <div class="clothesline" id="wall"></div>
  </div>

  <script src="gallery.js"></script>
  <script>
    const wall = document.getElementById("wall");
    const PER_ROW = 4;          // 한 줄에 걸 폴라로이드 수
    const rots = [-4, 3, -2, 4, -3, 2, -5, 3]; // 살짝 삐뚤빼뚤

    probeImages("assets/photos/photo", IMG_EXTS, (list) => {
      if (!list.length) {
        wall.innerHTML = '<p class="empty2">아직 사진이 없어요. assets/photos/ 에 photo1.jpg, photo2.jpg … 로 올려주세요.</p>';
        return;
      }
      for (let i = 0; i < list.length; i += PER_ROW) {
        const row = document.createElement("div");
        row.className = "line-row";
        const pins = document.createElement("div");
        pins.className = "pins";
        list.slice(i, i + PER_ROW).forEach((src, j) => {
          const n = i + j + 1;
          const a = document.createElement("a");
          a.className = "polaroid";
          a.href = "photo.html?n=" + n;
          a.style.setProperty("--rot", (rots[(n - 1) % rots.length]) + "deg");
          a.innerHTML =
            '<span class="pin"></span>' +
            '<div class="photo"><img loading="lazy" alt="사진 ' + n + '"></div>' +
            '<div class="cap">사진 ' + n + "</div>";
          const img = a.querySelector("img");
          img.src = src;
          img.addEventListener("error", () => { img.replaceWith(Object.assign(document.createElement("div"), { className: "ph", textContent: "사진 없음" })); });
          pins.appendChild(a);
        });
        row.appendChild(pins);
        wall.appendChild(row);
      }
    });
  </script>
</body>
</html>

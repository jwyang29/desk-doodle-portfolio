<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 📷</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    body { background: #f3efe6; }
    .photo-nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .scrap { max-width: 560px; margin: 16px auto 0; text-align: center; }

    /* 꾸미는 대상: 폴라로이드 사진 */
    .polaroid-canvas {
      width: min(300px, 78vw); margin: 0 auto; background: #fff; padding: 8% 8% 0;
      border-radius: 3px; box-shadow: 4px 9px 16px rgba(60,45,30,0.3); transform: rotate(-1.2deg);
    }
    .p-photo { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #e9e4da; touch-action: none; }
    .p-photo > img.base { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p-photo .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #b3a89a; font-size: 13px; }
    .p-cap { font-family: "Caveat", "Gaegu", cursive; font-size: clamp(17px, 4vw, 22px); text-align: center; padding: 9px 2px 13px; color: #4a4038; }

    /* 스티커 시트(킹받는 하뚜) */
    .sheet-label { font-size: 15px; color: #777; margin: 20px 0 6px; }
    .sheet { position: relative; width: min(440px, 94vw); margin: 0 auto 16px; touch-action: none; }
    .sheet-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; }

    /* 스티커 (시트/사진/드래그 공통) — 중심 기준 배치 */
    .sticker { position: absolute; transform: translate(-50%, -50%); cursor: grab; touch-action: none; user-select: none; -webkit-user-drag: none; z-index: 5; }
    .sticker.dragging { position: fixed; z-index: 999; cursor: grabbing; transform: translate(-50%, -50%) scale(1.1) rotate(-4deg); filter: drop-shadow(0 6px 7px rgba(0,0,0,0.32)); }

    .actions { margin-top: 16px; }
    .actions button { font-family: inherit; font-size: 16px; cursor: pointer; border: 2px solid var(--ink); border-radius: 12px; background: #fee75c; padding: 8px 16px; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
    .actions button:hover { background: #ffe12e; }
    .hint2 { font-size: 15px; color: #777; margin: 10px 2px 0; }
    .loading { color: #999; padding: 30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo-nav">
      <a class="back" href="camera.html">← 사진들로</a>
      <a class="back" href="index.html">책상으로</a>
    </div>

    <div class="scrap">
      <div class="polaroid-canvas">
        <div class="p-photo" id="pPhoto"><span class="ph">사진</span></div>
        <div class="p-cap" id="pCap">사진</div>
      </div>

      <p class="sheet-label">🩹 아래 하트를 떼서 사진에 붙여보세요 (다시 떼면 시트로 돌아가요)</p>
      <div id="sheets"></div>

      <div class="actions"><button id="save">이대로 저장 💾</button></div>
      <p class="hint2">다 꾸미면 저장! 사진들 페이지에 꾸민 모습이 미리보기로 떠요 ✨</p>
    </div>
    <p class="loading" id="loading">불러오는 중…</p>
  </div>

  <script src="storage.js"></script>
  <script src="gallery.js"></script>
  <script>
    const n = Math.max(1, parseInt(new URLSearchParams(location.search).get("n") || "1", 10));
    document.title = "사진 " + n + " 📷";
    document.getElementById("pCap").textContent = "사진 " + n;
    const pPhoto = document.getElementById("pPhoto");
    const sheetsWrap = document.getElementById("sheets");
    let picImg = null;

    // 스티커 패널: 각 시트 배경 + 담긴 스티커 번호
    const PANELS = [
      { bg: "board.png", ids: [1, 2, 3, 4, 5] },        // 킹받는 하뚜 ♥ (빨강)
      { bg: "panel2.png", ids: [6, 7, 8, 9, 10, 11] },  // 킹받는 흑화뚜 🖤 (검정)
    ];

    const loadImage = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    function contentBBox(img) {
      const cw = Math.min(600, img.naturalWidth), ch = Math.round(img.naturalHeight * Math.min(600, img.naturalWidth) / img.naturalWidth);
      const c = document.createElement("canvas"); c.width = cw; c.height = ch;
      const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, cw, ch);
      const d = x.getImageData(0, 0, cw, ch).data;
      let minx = cw, miny = ch, maxx = 0, maxy = 0, found = false;
      for (let y = 0; y < ch; y++) for (let xx = 0; xx < cw; xx++) {
        const i = (y * cw + xx) * 4, white = d[i] > 240 && d[i + 1] > 240 && d[i + 2] > 240;
        if (d[i + 3] > 30 && !white) { found = true; if (xx < minx) minx = xx; if (xx > maxx) maxx = xx; if (y < miny) miny = y; if (y > maxy) maxy = y; }
      }
      return found ? { cw, ch, minx, miny, maxx, maxy, data: d } : null;
    }
    function cropUrl(img, bb, pad, cap) {
      pad = pad || 2; cap = cap || 700;
      const sx = img.naturalWidth / bb.cw, sy = img.naturalHeight / bb.ch;
      const L = Math.max(0, (bb.minx - pad) * sx), T = Math.max(0, (bb.miny - pad) * sy);
      const W = Math.min(img.naturalWidth - L, (bb.maxx - bb.minx + pad * 2) * sx);
      const H = Math.min(img.naturalHeight - T, (bb.maxy - bb.miny + pad * 2) * sy);
      const scale = Math.min(1, cap / W);
      const c = document.createElement("canvas"); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
      c.getContext("2d").drawImage(img, L, T, W, H, 0, 0, c.width, c.height);
      return { url: c.toDataURL("image/png"), w: c.width, h: c.height };
    }
    function innerRect(bb) {
      const d = bb.data, cw = bb.cw;
      const dark = (x, y) => { const i = (y * cw + x) * 4; return d[i + 3] > 30 && !(d[i] > 240 && d[i + 1] > 240 && d[i + 2] > 240); };
      const cx = Math.round((bb.minx + bb.maxx) / 2), cy = Math.round(bb.miny + (bb.maxy - bb.miny) * 0.62);
      let l = cx; while (l > bb.minx && !dark(l, cy)) l--; l++;
      let r = cx; while (r < bb.maxx && !dark(r, cy)) r++; r--;
      let t = cy; while (t > bb.miny && !dark(cx, t)) t--; t++;
      let b = cy; while (b < bb.maxy && !dark(cx, b)) b++; b--;
      const W = bb.maxx - bb.minx, H = bb.maxy - bb.miny;
      return { left: (l - bb.minx) / W, top: (t - bb.miny) / H, width: (r - l) / W, height: (b - t) / H };
    }
    const findPhoto = async (num) => {
      for (const ext of IMG_EXTS) { try { return await loadImage("assets/photos/photo" + num + "." + ext + "?v=" + Date.now()); } catch (e) {} }
      return null;
    };
    function coverDraw(x, img, dx, dy, dw, dh) {
      const ir = img.naturalWidth / img.naturalHeight, dr = dw / dh; let sw, sh, sx0, sy0;
      if (ir > dr) { sh = img.naturalHeight; sw = sh * dr; sx0 = (img.naturalWidth - sw) / 2; sy0 = 0; }
      else { sw = img.naturalWidth; sh = sw / dr; sx0 = 0; sy0 = (img.naturalHeight - sh) / 2; }
      x.drawImage(img, sx0, sy0, sw, sh, dx, dy, dw, dh);
    }

    /* ---- 3/2(3열) 그리드 홈 좌표 계산 ---- */
    function computeHomes(inner, count) {
      const perRow = 3, rows = Math.ceil(count / perRow), homes = [], wPct = inner.width * 24 * 100;
      let idx = 0;
      for (let r = 0; r < rows; r++) {
        const k = Math.min(perRow, count - r * perRow);
        for (let c = 0; c < k; c++) {
          homes[idx++] = {
            left: (inner.left + inner.width * ((c + 0.5) / k)) * 100,
            top: (inner.top + inner.height * ((r + 0.5) / rows)) * 100,
            w: inner.width * 24,
          };
        }
      }
      return homes;
    }

    /* ---- 드래그: 시트 <-> 사진 (스티커별 home 은 el._home 에 저장) ---- */
    let drag = null;
    function grab(e, el) {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const cxp = r.left + r.width / 2, cyp = r.top + r.height / 2;
      document.body.appendChild(el);
      el.className = "sticker dragging";
      el.style.width = r.width + "px"; el.style.height = "auto";
      drag = { el, offX: e.clientX - cxp, offY: e.clientY - cyp, pxW: r.width };
      move(e.clientX, e.clientY);
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.onpointermove = (ev) => move(ev.clientX, ev.clientY);
      el.onpointerup = (ev) => drop(ev);
    }
    function move(cx, cy) { if (!drag) return; drag.el.style.left = (cx - drag.offX) + "px"; drag.el.style.top = (cy - drag.offY) + "px"; }
    function drop(ev) {
      if (!drag) return;
      const el = drag.el; el.onpointermove = el.onpointerup = null;
      const ph = pPhoto.getBoundingClientRect();
      const inside = ev.clientX >= ph.left && ev.clientX <= ph.right && ev.clientY >= ph.top && ev.clientY <= ph.bottom;
      if (inside) {
        pPhoto.appendChild(el); el.className = "sticker";
        el.style.width = (drag.pxW / ph.width * 100) + "%"; el.style.height = "auto";
        el.style.left = ((ev.clientX - drag.offX - ph.left) / ph.width * 100) + "%";
        el.style.top = ((ev.clientY - drag.offY - ph.top) / ph.height * 100) + "%";
        el.onpointerdown = (e2) => grab(e2, el);
      } else {
        returnHome(el);
      }
      drag = null;
    }
    function returnHome(el) {
      const h = el._home;
      h.sheet.appendChild(el); el.className = "sticker";
      el.style.left = h.left + "%"; el.style.top = h.top + "%"; el.style.width = h.w + "%"; el.style.height = "auto";
      el.onpointerdown = (e2) => grab(e2, el);
      el.onpointermove = el.onpointerup = null;
    }

    /* ---- 저장: 스티커 붙은 사진(정사각)만 합성 ---- */
    function exportPhoto() {
      const pr = pPhoto.getBoundingClientRect();
      const E = 640, sx = E / pr.width, sy = E / pr.height;
      const cv = document.createElement("canvas"); cv.width = E; cv.height = E;
      const x = cv.getContext("2d");
      x.fillStyle = "#e9e4da"; x.fillRect(0, 0, E, E);
      if (picImg) coverDraw(x, picImg, 0, 0, E, E);
      pPhoto.querySelectorAll(".sticker").forEach((el) => {
        const r = el.getBoundingClientRect();
        x.drawImage(el, (r.left - pr.left) * sx, (r.top - pr.top) * sy, r.width * sx, r.height * sy);
      });
      return cv.toDataURL("image/jpeg", 0.85);
    }
    document.getElementById("save").addEventListener("click", () => {
      try { localStorage.setItem("deco_" + n, exportPhoto()); showToast("저장됐어요! 사진들 페이지에서 미리보기로 보여요 ✨"); }
      catch (e) { console.error(e); alert("저장 공간이 부족해요 ㅠ"); }
    });

    /* ---- 초기화 ---- */
    (async () => {
      try {
        // 사진
        picImg = await findPhoto(n);
        if (picImg) { pPhoto.innerHTML = '<img class="base" alt="사진 ' + n + '">'; pPhoto.querySelector("img").src = picImg.src; }
        else pPhoto.innerHTML = '<span class="ph">사진 없음</span>';

        // 스티커 패널들(킹받는 하뚜 / 흑화뚜) — 각각 시트 + 스티커 배치
        for (const panel of PANELS) {
          let bimg;
          try { bimg = await loadImage("assets/" + panel.bg); } catch (e) { continue; }
          const bbb = contentBBox(bimg); if (!bbb) continue;
          const bcrop = cropUrl(bimg, bbb, 2, 1000);
          const sheet = document.createElement("div");
          sheet.className = "sheet";
          sheet.style.aspectRatio = bcrop.w + " / " + bcrop.h;
          const bg = document.createElement("img");
          bg.className = "sheet-bg"; bg.src = bcrop.url; bg.alt = "스티커 시트";
          sheet.appendChild(bg);
          sheetsWrap.appendChild(sheet);

          const inner = innerRect(bbb);
          const homes = computeHomes(inner, panel.ids.length);
          for (let j = 0; j < panel.ids.length; j++) {
            try {
              const s = await loadImage("assets/sticker" + panel.ids[j] + ".png");
              const bb = contentBBox(s); if (!bb) continue;
              const el = document.createElement("img");
              el.src = cropUrl(s, bb, 3, 500).url; el.draggable = false;
              el._home = { sheet, left: homes[j].left, top: homes[j].top, w: homes[j].w };
              returnHome(el);
            } catch (e) {}
          }
        }
      } catch (e) { console.error(e); }
      document.getElementById("loading").remove();
    })();
  </script>
</body>
</html>

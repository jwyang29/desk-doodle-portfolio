<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 📷</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    body { background: #f3efe6; }
    .photo-nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .scrap { max-width: 560px; margin: 18px auto 0; text-align: center; }

    /* 스티커 배경지 (킹받는 하뚜 보드) */
    .board { position: relative; width: min(520px, 94vw); margin: 0 auto; touch-action: none; }
    .board-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; }

    /* 사진 = 폴라로이드 (카메라 페이지와 동일 스타일) */
    .mini-polaroid {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 50%; background: #fff; padding: 6% 6% 0; border-radius: 3px;
      box-shadow: 3px 7px 12px rgba(60,45,30,0.3); z-index: 3;
    }
    .mini-polaroid .p-photo { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #e9e4da; }
    .mini-polaroid .p-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mini-polaroid .p-photo .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #b3a89a; font-size: 13px; }
    .mini-polaroid .p-cap { font-family: "Caveat", "Gaegu", cursive; font-size: clamp(15px, 3.4vw, 20px); text-align: center; padding: 7px 2px 11px; color: #4a4038; }

    /* 붙인 스티커 */
    .placed { position: absolute; width: 20%; height: auto; cursor: grab; touch-action: none; user-select: none; -webkit-user-drag: none; z-index: 5; }
    .placed.dragging { cursor: grabbing; transform: scale(1.08); filter: drop-shadow(0 5px 6px rgba(0,0,0,0.3)); z-index: 60; }

    /* 스티커 트레이 + 저장 */
    .tray-wrap { margin-top: 18px; }
    .tray { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 10px; background: #fff; border: 2px dashed var(--ink); border-radius: 16px; }
    .tray-sticker { width: 60px; height: 60px; object-fit: contain; cursor: grab; touch-action: none; user-select: none; -webkit-user-drag: none; transition: transform .12s ease; }
    .tray-sticker:hover { transform: scale(1.12) rotate(-4deg); }
    .actions { margin-top: 12px; }
    .actions button { font-family: inherit; font-size: 16px; cursor: pointer; border: 2px solid var(--ink); border-radius: 12px; background: #fee75c; padding: 8px 16px; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
    .actions button:hover { background: #ffe12e; }
    .hint2 { font-size: 15px; color: #777; margin: 10px 2px 0; }
    .loading { color: #999; padding: 30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo-nav">
      <a class="back" href="camera.html">← 사진들로</a>
      <a class="back" href="index.html">책상으로</a>
    </div>

    <div class="scrap">
      <div class="board" id="board">
        <img class="board-bg" id="boardBg" alt="" />
        <div class="mini-polaroid" id="pola">
          <div class="p-photo" id="pPhoto"><span class="ph">사진</span></div>
          <div class="p-cap" id="pCap">사진</div>
        </div>
      </div>
      <div class="tray-wrap">
        <div class="tray" id="tray"></div>
        <div class="actions"><button id="save">이대로 저장 💾</button></div>
        <p class="hint2">🩹 스티커를 <b>보드 위로 드래그</b>해서 붙이고, 다 꾸미면 저장! (붙인 스티커는 옮기거나 보드 밖으로 빼면 떼어져요)</p>
      </div>
    </div>
    <p class="loading" id="loading">불러오는 중…</p>
  </div>

  <script src="storage.js"></script>
  <script src="gallery.js"></script>
  <script>
    const n = Math.max(1, parseInt(new URLSearchParams(location.search).get("n") || "1", 10));
    document.title = "사진 " + n + " 📷";
    document.getElementById("pCap").textContent = "사진 " + n;
    const board = document.getElementById("board");
    const tray = document.getElementById("tray");
    const pola = document.getElementById("pola");
    const pPhoto = document.getElementById("pPhoto");
    let boardBgImg = null, picImg = null;

    const loadImage = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

    function contentBBox(img) {
      const cw = Math.min(600, img.naturalWidth);
      const ch = Math.round(img.naturalHeight * cw / img.naturalWidth);
      const c = document.createElement("canvas"); c.width = cw; c.height = ch;
      const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, cw, ch);
      const d = x.getImageData(0, 0, cw, ch).data;
      let minx = cw, miny = ch, maxx = 0, maxy = 0, found = false;
      for (let y = 0; y < ch; y++) for (let xx = 0; xx < cw; xx++) {
        const i = (y * cw + xx) * 4;
        const white = d[i] > 240 && d[i + 1] > 240 && d[i + 2] > 240;
        if (d[i + 3] > 30 && !white) { found = true; if (xx < minx) minx = xx; if (xx > maxx) maxx = xx; if (y < miny) miny = y; if (y > maxy) maxy = y; }
      }
      return found ? { cw, ch, minx, miny, maxx, maxy, data: d } : null;
    }
    function cropUrl(img, bb, pad, cap) {
      pad = pad || 2; cap = cap || 700;
      const sx = img.naturalWidth / bb.cw, sy = img.naturalHeight / bb.ch;
      const L = Math.max(0, (bb.minx - pad) * sx), T = Math.max(0, (bb.miny - pad) * sy);
      const W = Math.min(img.naturalWidth - L, (bb.maxx - bb.minx + pad * 2) * sx);
      const H = Math.min(img.naturalHeight - T, (bb.maxy - bb.miny + pad * 2) * sy);
      const scale = Math.min(1, cap / W);
      const c = document.createElement("canvas"); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
      c.getContext("2d").drawImage(img, L, T, W, H, 0, 0, c.width, c.height);
      return { url: c.toDataURL("image/png"), w: c.width, h: c.height };
    }
    function innerRect(bb) {
      const d = bb.data, cw = bb.cw;
      const dark = (x, y) => { const i = (y * cw + x) * 4; return d[i + 3] > 30 && !(d[i] > 240 && d[i + 1] > 240 && d[i + 2] > 240); };
      const cx = Math.round((bb.minx + bb.maxx) / 2);
      const cy = Math.round(bb.miny + (bb.maxy - bb.miny) * 0.62);
      let l = cx; while (l > bb.minx && !dark(l, cy)) l--; l++;
      let r = cx; while (r < bb.maxx && !dark(r, cy)) r++; r--;
      let t = cy; while (t > bb.miny && !dark(cx, t)) t--; t++;
      let b = cy; while (b < bb.maxy && !dark(cx, b)) b++; b--;
      const W = bb.maxx - bb.minx, H = bb.maxy - bb.miny;
      return { left: (l - bb.minx) / W, top: (t - bb.miny) / H, width: (r - l) / W, height: (b - t) / H };
    }
    const findPhoto = async (num) => {
      for (const ext of IMG_EXTS) {
        try { const im = await loadImage("assets/photos/photo" + num + "." + ext + "?v=" + Date.now()); return im; } catch (e) {}
      }
      return null;
    };

    /* ---- 드래그 ---- */
    let active = null, offX = 0, offY = 0;
    function makePlaced(url) {
      const el = document.createElement("img");
      el.className = "placed"; el.src = url; el.draggable = false;
      board.appendChild(el);
      el.addEventListener("pointerdown", (e) => startDrag(e, el, false));
      return el;
    }
    function startDrag(e, el, isTray, url) {
      e.preventDefault();
      if (isTray) el = makePlaced(url);
      active = el; el.classList.add("dragging"); board.appendChild(el);
      const r = el.getBoundingClientRect();
      offX = isTray ? r.width / 2 : e.clientX - r.left;
      offY = isTray ? r.height / 2 : e.clientY - r.top;
      moveTo(e.clientX, e.clientY);
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.onpointermove = (ev) => moveTo(ev.clientX, ev.clientY);
      el.onpointerup = (ev) => endDrag(ev);
    }
    function moveTo(cx, cy) {
      if (!active) return;
      const br = board.getBoundingClientRect();
      active.style.left = ((cx - br.left - offX) / br.width * 100) + "%";
      active.style.top = ((cy - br.top - offY) / br.height * 100) + "%";
    }
    function endDrag(ev) {
      if (!active) return;
      const br = board.getBoundingClientRect();
      if (ev.clientX < br.left - 30 || ev.clientX > br.right + 30 || ev.clientY < br.top - 30 || ev.clientY > br.bottom + 30) active.remove();
      active.classList.remove("dragging");
      active.onpointermove = null; active.onpointerup = null; active = null;
    }
    function addTraySticker(url) {
      const t = document.createElement("img");
      t.className = "tray-sticker"; t.src = url; t.draggable = false;
      t.addEventListener("pointerdown", (e) => startDrag(e, null, true, url));
      tray.appendChild(t);
    }

    /* ---- 저장(합성 이미지 만들기) ---- */
    function roundRect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
    function coverDraw(x, img, dx, dy, dw, dh) {
      const ir = img.naturalWidth / img.naturalHeight, dr = dw / dh; let sw, sh, sx0, sy0;
      if (ir > dr) { sh = img.naturalHeight; sw = sh * dr; sx0 = (img.naturalWidth - sw) / 2; sy0 = 0; }
      else { sw = img.naturalWidth; sh = sw / dr; sx0 = 0; sy0 = (img.naturalHeight - sh) / 2; }
      x.drawImage(img, sx0, sy0, sw, sh, dx, dy, dw, dh);
    }
    function exportBoard() {
      const br = board.getBoundingClientRect();
      const EW = 720, EH = Math.round(EW * br.height / br.width);
      const sx = EW / br.width, sy = EH / br.height;
      const cv = document.createElement("canvas"); cv.width = EW; cv.height = EH;
      const x = cv.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, EW, EH);
      if (boardBgImg) x.drawImage(boardBgImg, 0, 0, EW, EH);
      const map = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - br.left) * sx, y: (r.top - br.top) * sy, w: r.width * sx, h: r.height * sy }; };
      // 폴라로이드
      const pe = map(pola);
      x.save(); x.shadowColor = "rgba(60,45,30,0.25)"; x.shadowBlur = 8 * sx; x.shadowOffsetY = 5 * sy;
      x.fillStyle = "#fff"; roundRect(x, pe.x, pe.y, pe.w, pe.h, 4 * sx); x.fill(); x.restore();
      const phe = map(pPhoto);
      if (picImg) coverDraw(x, picImg, phe.x, phe.y, phe.w, phe.h);
      const ce = map(document.getElementById("pCap"));
      x.fillStyle = "#4a4038"; x.textAlign = "center"; x.textBaseline = "middle";
      x.font = "700 " + Math.round(ce.h * 0.6) + "px Gaegu, sans-serif";
      x.fillText("사진 " + n, ce.x + ce.w / 2, ce.y + ce.h / 2);
      // 스티커
      board.querySelectorAll(".placed").forEach((el) => { const m = map(el); x.drawImage(el, m.x, m.y, m.w, m.h); });
      return cv.toDataURL("image/jpeg", 0.85);
    }
    document.getElementById("save").addEventListener("click", () => {
      try {
        const url = exportBoard();
        localStorage.setItem("deco_" + n, url);
        showToast("저장됐어요! 사진들 페이지에서 미리보기로 보여요 ✨");
      } catch (e) { console.error(e); alert("저장 공간이 부족해요 ㅠ"); }
    });

    /* ---- 초기화 ---- */
    (async () => {
      try {
        const bimg = await loadImage("assets/board.png");
        boardBgImg = bimg;
        const bbb = contentBBox(bimg);
        const bcrop = cropUrl(bimg, bbb, 2, 1000);
        boardBgImg = await loadImage(bcrop.url); // 크롭본을 합성/표시에 사용
        board.style.aspectRatio = bcrop.w + " / " + bcrop.h;
        document.getElementById("boardBg").src = bcrop.url;
        // 폴라로이드를 보드 안쪽 네모칸 중앙에 배치
        const inner = innerRect(bbb);
        pola.style.left = (inner.left + inner.width / 2) * 100 + "%";
        pola.style.top = (inner.top + inner.height / 2) * 100 + "%";
        pola.style.width = Math.min(56, inner.width * 100 * 0.82) + "%";
        // 사진
        picImg = await findPhoto(n);
        if (picImg) { pPhoto.innerHTML = '<img alt="사진 ' + n + '">'; pPhoto.querySelector("img").src = picImg.src; }
        else pPhoto.innerHTML = '<span class="ph">사진 없음</span>';
        // 스티커
        for (let i = 1; i <= 5; i++) {
          try { const s = await loadImage("assets/sticker" + i + ".png"); const bb = contentBBox(s); if (!bb) continue; addTraySticker(cropUrl(s, bb, 3, 500).url); } catch (e) {}
        }
      } catch (e) { console.error(e); }
      document.getElementById("loading").remove();
    })();
  </script>
</body>
</html>

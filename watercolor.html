<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물감 놀이 🖌️</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pages.css" />
  <style>
    .paintwrap { position: relative; }
    canvas.paint { width: 100%; height: min(60vh, 520px); background: #fff; border: 3px solid var(--ink); border-radius: 14px; display: block; cursor: crosshair; touch-action: none; }
    .palette { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; }
    .dot.active { outline: 3px solid var(--ink); outline-offset: 2px; }
    .brushes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .brush { font-family: inherit; cursor: pointer; border: 2px solid var(--ink); border-radius: 12px; background: #fff; padding: 6px 12px; font-size: 15px; }
    .brush.active { background: #fff7d6; outline: 3px solid var(--ink); outline-offset: 2px; }
    .sizewrap { display: flex; align-items: center; gap: 6px; font-size: 15px; }
    .tools button { font-family: inherit; cursor: pointer; border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 7px 14px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 책상으로</a>
    <h1>물감 놀이 🖌️</h1>
    <p class="sub">브러시를 골라서 칠하고 튀겨보세요. (누르고 드래그!)</p>
    <div class="card">
      <div class="tools palette" id="palette"></div>
      <div class="brushes" id="brushes">
        <button class="brush active" data-brush="splat">💧 물방울</button>
        <button class="brush" data-brush="brush">🖌️ 붓</button>
        <button class="brush" data-brush="spray">✨ 스프레이</button>
        <button class="brush" data-brush="crayon">🖍️ 크레용</button>
        <button class="brush" data-brush="marker">🖊️ 마커</button>
        <label class="sizewrap">굵기 <input type="range" id="size" min="6" max="46" value="20" /></label>
      </div>
      <div class="tools">
        <button id="clear">전체 지우기 🧽</button>
        <button id="save">디지털 드로잉에 저장 💾</button>
      </div>
      <div class="paintwrap"><canvas id="paint" class="paint"></canvas></div>
    </div>
  </div>
  <script src="storage.js"></script>
  <script>
    const COLORS = ["#e5484d", "#f5a524", "#f6e05e", "#2b8a3e", "#1c7ed6", "#9c36b5", "#111"];
    const canvas = document.getElementById("paint");
    const ctx = canvas.getContext("2d");
    let color = COLORS[0], brush = "splat", size = 20;
    let dpr = 1, down = false, hx = 0, hy = 0, lastX = 0, lastY = 0;

    function fit() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    fit(); window.addEventListener("resize", fit);

    /* 팔레트 */
    const palette = document.getElementById("palette");
    COLORS.forEach((c, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i === 0 ? " active" : "");
      d.style.background = c;
      d.addEventListener("click", () => { color = c; palette.querySelectorAll(".dot").forEach((x) => x.classList.remove("active")); d.classList.add("active"); });
      palette.appendChild(d);
    });
    /* 브러시 선택 */
    document.querySelectorAll(".brush").forEach((b) => b.addEventListener("click", () => {
      brush = b.dataset.brush;
      document.querySelectorAll(".brush").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
    }));
    document.getElementById("size").addEventListener("input", (e) => { size = +e.target.value; });

    /* ---- 브러시별 그리기 ---- */
    function dab(x, y, r, alpha) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    function splat(x, y, radius) {
      ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.85; ctx.beginPath();
      const pts = 14;
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2, rr = radius * (0.7 + Math.random() * 0.6);
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      const n = 6 + Math.floor(Math.random() * 6);
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2, dist = radius + Math.random() * radius * 3;
        ctx.beginPath();
        ctx.arc(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, 1 + Math.random() * radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    function spray(x, y) {
      const n = 18 + Math.floor(size);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, d = Math.random() * size * 1.4;
        dab(x + Math.cos(a) * d, y + Math.sin(a) * d, 0.6 + Math.random() * 1.6, 0.5);
      }
    }
    // 두 점 사이를 촘촘히 채워 부드러운 획
    function along(x0, y0, x1, y1, step, draw) {
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const n = Math.max(1, Math.floor(dist / step));
      for (let i = 0; i <= n; i++) { const t = i / n; draw(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t); }
    }
    function stroke(x0, y0, x1, y1) {
      if (brush === "brush") {
        along(x0, y0, x1, y1, Math.max(1, size / 6), (x, y) => dab(x, y, size / 2, 0.35));
      } else if (brush === "marker") {
        ctx.save(); ctx.globalAlpha = 0.9; ctx.strokeStyle = color;
        ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = size * 0.7;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
      } else if (brush === "crayon") {
        along(x0, y0, x1, y1, Math.max(1, size / 8), (x, y) => {
          for (let k = 0; k < 5; k++) {
            const a = Math.random() * Math.PI * 2, rr = Math.random() * size * 0.5;
            dab(x + Math.cos(a) * rr, y + Math.sin(a) * rr, size * 0.12, 0.25);
          }
        });
      } else if (brush === "spray") {
        along(x0, y0, x1, y1, Math.max(2, size / 3), (x, y) => spray(x, y));
      }
    }

    const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    canvas.addEventListener("pointerdown", (e) => {
      const p = pos(e); down = true; hx = lastX = p.x; hy = lastY = p.y;
      if (brush === "splat") splat(p.x, p.y, size * 0.9);
      else if (brush === "spray") spray(p.x, p.y);
      else stroke(p.x, p.y, p.x + 0.01, p.y);
    });
    canvas.addEventListener("pointermove", (e) => {
      const p = pos(e); hx = p.x; hy = p.y;
      if (down && brush !== "splat") { stroke(lastX, lastY, p.x, p.y); }
      lastX = p.x; lastY = p.y;
    });
    const stop = () => (down = false);
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointerleave", stop);
    // 물방울: 누르고 있으면 계속 번짐
    setInterval(() => { if (down && brush === "splat") splat(hx, hy, size * 0.5 + Math.random() * size * 0.4); }, 90);

    document.getElementById("clear").addEventListener("click", () => {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
    });
    document.getElementById("save").addEventListener("click", () => {
      if (saveDrawingFromCanvas(canvas, "물감놀이")) showToast("저장됐어요! 디지털 드로잉에서 볼 수 있어요 🎨");
    });
  </script>
</body>
</html>
